name: Validate skill and standalone source
on: [push, pull_request, workflow_dispatch]
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -X utf8 build.py
      - run: python -X utf8 tests/run_all.py
      - run: python -X utf8 audit_readiness.py
      - run: python -X utf8 export_source.py
      - run: python -X utf8 tests/verify_source.py
